name: Ventilator simulator checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Unit tests
        run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Headless Chromium acceptance checks
        run: |
          python3 -m http.server 8077 --bind 127.0.0.1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node tests/browser-check.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: artifacts/browser/
          if-no-files-found: ignore

  package:
    needs: [test, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage public-safe static web files only
        run: |
          mkdir -p dist/src
          cp index.html styles.css dist/
          cp src/app.js src/sim-model.js src/waveform-model.js src/setting-editor.js src/education-content.js src/release-notes.js src/waveform-inspector.js src/preclinical-cases.js src/case-engine.js src/case-quality.js dist/src/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/src/app.js
          test -s dist/src/sim-model.js
          test -s dist/src/waveform-model.js
          test -s dist/src/setting-editor.js
          test -s dist/src/education-content.js
          test -s dist/src/release-notes.js
          test -s dist/src/waveform-inspector.js
          test -s dist/src/preclinical-cases.js
          test -s dist/src/case-engine.js
          test -s dist/src/case-quality.js
      - uses: actions/upload-artifact@v4
        with:
          name: pb980-web-only
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
